name: Hashmarks Dogfood Source Audit

on:
  pull_request:
    paths:
      - ".github/workflows/hashmarks-dogfood.yml"
      - "benchmarks/dogfood/**"
      - "benchmarks/tests/test_hashmarks_dogfood_corpus.py"
      - "benchmarks/tests/test_hashmarks_dogfood_coverage.py"
      - "benchmarks/tests/test_hashmarks_dogfood_review_handoff.py"
      - "benchmarks/tests/test_hashmarks_dogfood_declarations.py"
      - "benchmarks/tests/test_hashmarks_dogfood_collisions.py"
      - "benchmarks/tests/test_hashmarks_dogfood_callsites.py"
      - "benchmarks/tests/test_hashmarks_dogfood_headroom.py"
      - "benchmarks/tests/test_hashmarks_dogfood_baseline_staging.py"
      - "benchmarks/tests/test_hashmarks_blind_review.py"
      - "benchmarks/tests/test_hashmarks_review_returns.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    name: Frozen Hashmarks source identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EvalShot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout full Hashmarks history
        uses: actions/checkout@v4
        with:
          repository: Hugloss/Hashmarks
          ref: main
          fetch-depth: 0
          path: .dogfood-source/Hashmarks
          persist-credentials: false

      # The frozen benchmark source may no longer be reachable from a
      # current branch/tag. Fetch its exact historical identity explicitly;
      # the dogfood auditor still verifies commit type, tree and source paths.
      - name: Fetch frozen Hashmarks benchmark commit
        run: |
          git -C .dogfood-source/Hashmarks fetch --no-tags origin \
            85453be578e8ff46b8d79b363f140a915d6804f6

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install repository Python
        run: uv python install

      - name: Focused model-free regressions
        run: uv run --no-project python -m unittest -q benchmarks.tests.test_hashmarks_dogfood_corpus benchmarks.tests.test_hashmarks_dogfood_coverage benchmarks.tests.test_hashmarks_dogfood_review_handoff benchmarks.tests.test_hashmarks_dogfood_declarations benchmarks.tests.test_hashmarks_dogfood_collisions benchmarks.tests.test_hashmarks_dogfood_callsites benchmarks.tests.test_hashmarks_dogfood_headroom benchmarks.tests.test_hashmarks_dogfood_baseline_staging benchmarks.tests.test_hashmarks_blind_review benchmarks.tests.test_hashmarks_review_returns

      - name: Verify frozen Hashmarks source identities
        run: |
          uv run --no-project python -m benchmarks.dogfood.hashmarks_corpus \
            --suite-root benchmarks/suites/repository-intelligence \
            --checkout .dogfood-source/Hashmarks \
            --require-source --gate-assigned-only \
            --output "$RUNNER_TEMP/hashmarks-source-audit.json"

      - name: Derive coverage gaps and review-only candidate queue
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_coverage \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --output "$RUNNER_TEMP/hashmarks-coverage.json"
          fi

      - name: Prepare independent candidate review handoff
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ] &&
             [ -f "$RUNNER_TEMP/hashmarks-coverage.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_review_handoff \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --coverage "$RUNNER_TEMP/hashmarks-coverage.json" \
              --output "$RUNNER_TEMP/hashmarks-review-handoff.json"
          fi

      - name: Observe nominated Python declarations at pinned source commit
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_declarations \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --checkout .dogfood-source/Hashmarks \
              --output "$RUNNER_TEMP/hashmarks-declarations.json"
          fi

      - name: Inspect alternative Python declarations in frozen source tree
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_collisions \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --checkout .dogfood-source/Hashmarks \
              --output "$RUNNER_TEMP/hashmarks-collisions.json"
          fi

      - name: Observe pinned Python call syntax (not a call graph)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_callsites \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --checkout .dogfood-source/Hashmarks \
              --output "$RUNNER_TEMP/hashmarks-callsites.json"
          fi

      - name: Audit exact-task native baseline eligibility
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hashmarks-source-audit.json" ]; then
            uv run --no-project python -m benchmarks.dogfood.hashmarks_headroom \
              --audit "$RUNNER_TEMP/hashmarks-source-audit.json" \
              --historical-pilot benchmarks/suites/repository-intelligence/native-evidence-pilot-v1/results/2026-10-21-summary.json \
              --output "$RUNNER_TEMP/hashmarks-headroom-readiness.json"
          fi

      - name: Generate answer-blinded first-pass reviewer packet (no model)
        run: |
          uv run --no-project python -m benchmarks.dogfood.hashmarks_blind_review \
            --repository-root . \
            --suite benchmarks/dogfood/staged-suites/known-symbol-native-baseline-v1 \
            --output "$RUNNER_TEMP/hashmarks-blind-review.json"

      - name: Prepare sanitized first-pass response status without private answers
        run: |
          uv run --no-project python -m benchmarks.dogfood.hashmarks_review_returns \
            --repository-root . \
            --output "$RUNNER_TEMP/hashmarks-review-return-status.json"

      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashmarks-frozen-source-audit
          path: |
            ${{ runner.temp }}/hashmarks-source-audit.json
            ${{ runner.temp }}/hashmarks-coverage.json
            ${{ runner.temp }}/hashmarks-review-handoff.json
            ${{ runner.temp }}/hashmarks-declarations.json
            ${{ runner.temp }}/hashmarks-collisions.json
            ${{ runner.temp }}/hashmarks-callsites.json
            ${{ runner.temp }}/hashmarks-headroom-readiness.json
            ${{ runner.temp }}/hashmarks-blind-review.json
            ${{ runner.temp }}/hashmarks-review-return-status.json
          if-no-files-found: ignore
          retention-days: 7
